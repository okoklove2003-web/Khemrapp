<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Khmer Sub & Voice App</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    h2 { margin: 0 0 12px 0; font-size: 18px; color: #38bdf8; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    button, select, input[type="file"] {
      background: #334155; color: #fff; border: 1px solid #475569;
      padding: 9px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .btn-blue { background: #2563eb; border-color: #3b82f6; }
    .btn-green { background: #16a34a; border-color: #22c55e; }
    .btn-purple { background: #7c3aed; border-color: #8b5cf6; }
    .btn-red { background: #dc2626; border-color: #ef4444; }
    video { width: 100%; max-height: 240px; border-radius: 8px; background: #000; display: none; margin-bottom: 10px; }
    textarea {
      width: 100%; height: 240px; background: #0f172a; color: #e2e8f0;
      border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 14px; line-height: 1.5;
    }
    #msg { font-size: 13px; color: #fbbf24; margin-top: 6px; word-break: break-word; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 Khmer Sub & Voice Studio</h2>
    <div class="row">
      <button class="btn-blue" onclick="setKey()">🔑 API Key</button>
      <select id="model">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      </select>
      <input type="file" id="fileInput" accept="video/*,audio/*">
    </div>
    <div class="row">
      <button class="btn-purple" onclick="runAI()">✨ ស្រង់ & បកប្រែខ្មែរ</button>
      <button onclick="copyPrompt()">📋 Copy Prompt</button>
      <button class="btn-green" onclick="saveSrt()">💾 Save .SRT</button>
      <button onclick="copyOut()">📄 Copy SRT</button>
    </div>
    <video id="player" controls></video>
    <div id="msg">រួចរាល់! សូមដាក់ API Key និងរើសវីដេអូ (&lt; 18MB) ឬ Paste អត្ថបទ SRT ខាងក្រោម។</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn-blue" onclick="speakKhmer()">🔊 ស្តាប់សំឡេងខ្មែរ</button>
      <button class="btn-red" onclick="stopSpeak()">⏹️ ឈប់ស្តាប់</button>
      <select id="pitch">
        <option value="1.0">សំឡេងធម្មតា</option>
        <option value="0.75">សំឡេងប្រុស (គ្រលរ)</option>
        <option value="1.25">សំឡេងស្រី (ស្រួច)</option>
      </select>
      <select id="rate">
        <option value="1.0">ល្បឿន 1.0x</option>
        <option value="1.15">ល្បឿន 1.15x</option>
        <option value="1.3">ល្បឿន 1.3x</option>
      </select>
    </div>
    <textarea id="out" placeholder="1&#10;00:00:01,000 --> 00:00:04,000&#10;សួស្តី នេះជាអក្សររត់ភាសាខ្មែរ..."></textarea>
  </div>

<script>
  let fileObj = null;
  const msg = document.getElementById("msg");
  const out = document.getElementById("out");
  const player = document.getElementById("player");

  document.getElementById("fileInput").onchange = (e) => {
    fileObj = e.target.files[0];
    if (!fileObj) return;
    player.src = URL.createObjectURL(fileObj);
    player.style.display = "block";
    msg.innerText = `📁 បានរើស៖ ${fileObj.name} (${(fileObj.size/1024/1024).toFixed(2)} MB)`;
  };

  function setKey() {
    const k = prompt("បញ្ចូល Gemini API Key របស់អ្នក (AIza...):", localStorage.getItem("g_key") || "");
    if (k !== null) {
      localStorage.setItem("g_key", k.trim());
      msg.innerText = "✅ បានរក្សាទុក API Key រួចរាល់!";
    }
  }

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  function fmtTime(t) {
    if (!t) return "00:00:00,000";
    t = String(t).replace(".", ",");
    const p = t.split(":");
    if (p.length === 2) return `00:${p[0].padStart(2,"0")}:${p[1]}`;
    return t;
  }

  async function runAI() {
    const key = localStorage.getItem("g_key");
    if (!key) return alert("សូមចុច 🔑 API Key ដើម្បីដាក់ Key ជាមុនសិន!");
    if (!fileObj) return alert("សូមរើសវីដេអូ ឬសំឡេងជាមុនសិន!");
    if (fileObj.size > 18 * 1024 * 1024) return alert("File ធំជាង 18MB! សូមបំប្លែងជាសំឡេង MP3 ឬកាត់ឱ្យតូចជាង 18MB។");

    const model = document.getElementById("model").value;
    msg.innerText = `⏳ កំពុងផ្ញើទៅ ${model}...`;
    try {
      const b64 = await toBase64(fileObj);
      const mime = fileObj.type || "audio/mp3";
      const promptText = `ស្រង់សំឡេងពីវីដេអូនេះ រួចបកប្រែជាភាសាខ្មែរនិយាយធម្មជាតិ ខ្លីៗ ងាយស្តាប់ សម្រាប់បញ្ចូលសំឡេងរឿង។ ផ្ញើមកជា JSON Array តែប៉ុណ្ណោះ ឧទាហរណ៍: [{"in":"00:00:01,000","out":"00:00:04,000","text":"..."}]`;

      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: mime, data: b64 } }] }]
        })
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);

      const txt = j.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const m = txt.match(/\[[\s\S]*\]/);
      if (!m) throw new Error("AI មិនបានផ្ញើមកជាទម្រង់ JSON ត្រឹមត្រូវទេ");
      const arr = JSON.parse(m[0]);
      out.value = arr.map((x, i) => `${i+1}\n${fmtTime(x.in)} --> ${fmtTime(x.out)}\n${String(x.text || "").trim()}`).join("\n\n");
      msg.innerText = `✅ រួចរាល់ (${arr.length} ជួរ)!`;
    } catch (e) {
      msg.innerText = "❌ Error: " + e.message;
    }
  }

  function copyPrompt() {
    navigator.clipboard.writeText("ស្រង់សំឡេងពីវីដេអូនេះជាទម្រង់ SRT និងបកប្រែជាភាសាខ្មែរនិយាយធម្មជាតិ សម្រាប់បញ្ចូលសំឡេងរឿង រក្សាទម្រង់ SRT និងម៉ោងឱ្យដូចដើម។");
    msg.innerText = "📋 បាន Copy Prompt រួចរាល់! យកទៅ Paste ក្នុង AI Studio បាន។";
  }

  function copyOut() {
    navigator.clipboard.writeText(out.value);
    msg.innerText = "📄 បាន Copy អត្ថបទ SRT រួចរាល់!";
  }

  function saveSrt() {
    const b = new Blob([out.value], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "khmer_sub.srt";
    a.click();
  }

  function speakKhmer() {
    window.speechSynthesis.cancel();
    // លុបលេខជួរ និងម៉ោង SRT ចេញ ទុកតែអក្សរខ្មែរសម្រាប់អាន
    const cleanText = out.value
      .replace(/^\d+\s*$/gm, "")
      .replace(/\d{2}:\d{2}:\d{2}[,\.]\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}[,\.]\d{3}/g, "")
      .replace(/\n+/g, " ")
      .trim();
    if (!cleanText) return alert("មិនទាន់មានអក្សរខ្មែរក្នុងប្រអប់សម្រាប់អានទេ!");

    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = "km-KH";
    u.pitch = parseFloat(document.getElementById("pitch").value);
    u.rate = parseFloat(document.getElementById("rate").value);
    window.speechSynthesis.speak(u);
    msg.innerText = "🔊 កំពុងអានសំឡេងខ្មែរ...";
  }

  function stopSpeak() {
    window.speechSynthesis.cancel();
    msg.innerText = "⏹️ បានឈប់ស្តាប់សំឡេង។";
  }
</script>
</body>
</html>
